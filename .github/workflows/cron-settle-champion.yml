name: cron-settle-champion

on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Call settle-champion endpoint
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/settle-champion")
          echo "status: $response"
          cat /tmp/body | head -c 2000 || true
          test "$response" = "200"
